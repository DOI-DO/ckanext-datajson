[coverage:run]
omit=ckanext/datajson/tests/*

[flake8]
max-line-length = 127
ignore = E402, W605  # TODO disable once future.standard_libary is removed
# ignoring W605 because the linter catches errors in regex strings that are not meant to
#   be escaped

[tool:pytest]
norecursedirs=ckanext/datajson/tests/nose